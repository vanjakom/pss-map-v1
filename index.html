<html>
  <head>
    <meta charset="UTF-8">
    <title>Планинарски савез Србије - мапа</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.4/dist/leaflet.css" integrity="sha512-puBpdR0798OZvTTbP4A8Ix/l+A4dHDD0DGqYW6RQ+9jxkRFclaxxQb/SJAWZfWAkuyeQUytO7+7N4QKrDh+drA==" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.3.4/dist/leaflet.js" integrity="sha512-nMMmRyTVoLYqjP9hrbed9S+FzjZHW5gY1TWCHA5ckwXZBadntCNs8kEqAWdrb9O7rxbCaA4lKTIWjDXZxflOcA==" crossorigin=""></script>
    <style>
      ::-webkit-scrollbar {
	  display: none;
      }
      #content {
	  white-space: nowrap;
	  overflow: hidden;
      }
      
      #map {
	  position: absolute;
	  left: 0px;
	  top: 0px;
	  right: 300px;
	  bottom: 20px;
	  cursor: crosshair;
      }
      #navigation {
	  position: absolute;
	  top: 0px;
	  right: 0px;
	  bottom: 20px;
	  width: 300px;
	  overflow-y: scroll;	  
      }
      .navigation_trail {
	  widht: 300px;
	  background-color: #BFBFBF;
	  padding: 5px;
	  margin-top: 10px;
	  cursor: pointer;
	  white-space: pre-wrap;
	  word-wrap: break-word;
      }
      #status {
	  padding-left: 10px;
	  position: absolute;
	  right: 0px;
	  left: 0px;
	  bottom: 0px;
	  height: 20px;
	  overflow-y: scroll;
      }
    </style>      
  </head>
  <body>
    <div id="content">
      <div id="map"></div>
      <div id="navigation"></div>
      <div id="status">
	верзија: <a href="documentation/version.html" target="_blank">1.1(20260925)</a>, <a href="dataset/trail-list.html" target="_blank">регистар стаза</a>, <a href="documentation/index.html" target="_blank">документација</a>, <a href="documentation/index.html#issues" target="_blank">пријави проблем</a>
      </div>
    </div>
    <script type="text/javascript">
      let map = L.map("map", {maxBoundsViscosity: 1.0})
      map.setMaxBounds ([[-90,-180],[90,180]])

      let layers = L.control.layers()
      layers.addTo(map)
      
      let osmTile = L.tileLayer(
	  'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
	  {
	      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
	      maxZoom: 21,
	      bounds: [[-90,-180],[90,180]],
	      noWrap: true
	  })
      layers.addBaseLayer(osmTile, "OpenStreetMap")
      osmTile.addTo(map)

      let osmRSTile = L.tileLayer(
	  'http://ue.cache.osmsrbija.iz.rs/cir/{z}/{x}/{y}.png',
	  {
	      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
	      maxZoom: 21,
	      bounds: [[-90,-180],[90,180]],
	      noWrap: true
	  })
      layers.addBaseLayer(osmRSTile, "OpenStreetMap Србија")

      let openTopoTile = L.tileLayer(
	  'https://a.tile.opentopomap.org/{z}/{x}/{y}.png',
	  {
	      attribution: 'Map data: © OpenStreetMap contributors, SRTM | Map display: © OpenTopoMap (CC-BY-SA)',
	      maxZoom: 21,
	      bounds: [[-90,-180],[90,180]],
	      noWrap: true
	  })
      layers.addBaseLayer(openTopoTile, "OpenTopoMap")
      
      // trails are kept by ref ( PSS unique id )
      // for each trail following object is created
      //    feature: reference to Leaflet Layer
      //    infoDiv: div inside navigation
      //    properties: key value of geojson feature
      //        ref
      //        osm-relation-id
      //        name
      //        operator
      //        website
      //        network
      //        distance
      
      var trails = {}
      var selectedTrailId = null

      let colorSelected = "#ffff00"
      let colorTrail = "#e60000"
      let colorEPath = "#003399"
      let colorTransversal = "#993399"
      let trailStyleFn = function(feature) {
	  let trailId = feature.properties.ref
	  let selected = selectedTrailId == trailId
	  let color
	  let width
	  let opacity = 0.5
	  if (trailId.startsWith("E")) {
	      weight = selected ? 10 : 6
	      color = selected ? colorSelected : colorEPath
	  } else if (trailId.startsWith("T")) {
	      weight = selected ? 10 : 4
	      color = selected ? colorSelected : colorTransversal
	  } else {
	      weight = selected ? 10 : 2
	      color = selected ? colorSelected : colorTrail
	  }
	  return {
	      fillColor: color,
	      fillOpacity: opacity,
	      color: color,
	      stroke: true,
	      opacity: opacity,
	      weight: weight
	  }
      }
      
      let trailsLayer = L.featureGroup()
      layers.addOverlay(trailsLayer, "Регистар планинарских терена")
      trailsLayer.addTo(map)

      // markers use "marker-body" property for popup html, same convention
      // as clj-geo.visualization.map/geojson-style-extended-layer
      let nepravilnostiLayer = L.geoJSON(null, {
	  pointToLayer: function(feature, latlng) {
	      return L.marker(latlng)
	  },
	  onEachFeature: function(feature, layer) {
	      if (feature.properties && feature.properties["marker-body"]) {
		  layer.bindPopup(feature.properties["marker-body"], {maxWidth: "auto"})
	      }
	  }
      })
      layers.addOverlay(nepravilnostiLayer, "Неправилности")

      let selectTrailFn = function(trailId) {
	  let previousSelectedTrailId = selectedTrailId
	  selectedTrailId = trailId
	  if (previousSelectedTrailId != null) {
	      let previousTrail = trails[previousSelectedTrailId]
	      previousTrail.infoDiv.style.background = "#BFBFBF"
	      previousTrail.feature.setStyle(trailStyleFn)
	  }
	  if (selectedTrailId != null) {
	      let trail = trails[selectedTrailId]
	      trail.infoDiv.style.background = colorSelected
	      trail.infoDiv.scrollIntoView()
	      trail.feature.setStyle(trailStyleFn)
	      // ensure selected is on top
	      trailsLayer.removeLayer(trail.feature)
	      trailsLayer.addLayer(trail.feature)
	      // only move the view if the trail isn't at least partially
	      // visible already - avoids yanking the view for a trail the
	      // user can already see part of. checks actual line points
	      // against the viewport rather than just bounding boxes -
	      // two trails can have overlapping bounding boxes ( e.g.
	      // nearby trails in the same area ) while neither's actual
	      // rendered line is anywhere near the current view
	      var trailVisible = false
	      try {
		  let mapBounds = map.getBounds()
		  trail.feature.eachLayer(function(subLayer) {
		      if (trailVisible) {
			  return
		      }
		      let latlngs = subLayer.getLatLngs().flat(Infinity)
		      for (let i = 0; i < latlngs.length; i++) {
			  if (mapBounds.contains(latlngs[i])) {
			      trailVisible = true
			      break
			  }
		      }
		  })
	      } catch (e) {
		  trailVisible = false
	      }
	      if (!trailVisible) {
		  map.fitBounds(trail.feature.getBounds())
	      }
	  }
      }
      // reduces a club/operator name to the same anchor form used by
      // osm-pss-integration.job.staze/create-trail-list-club-html: lowercase,
      // diacritics transliterated, everything else stripped
      let simplifyClubFn = function(club) {
	  if (club == null) {
	      return ""
	  }
	  return club
	      .toLowerCase()
	      .replaceAll("č", "c")
	      .replaceAll("ć", "c")
	      .replaceAll("š", "s")
	      .replaceAll("ž", "z")
	      .replaceAll("đ", "dj")
	      .replace(/[^a-z]/g, "")
      }

      let parseHashParamsFn = function() {
	  var params = {}
	  if (window.location.hash.length > 1) {
	      let splits = window.location.hash.substring(1).split("&")
	      for (let index in splits) {
		  let pair = splits[index].split("=")
		  params[pair[0]] = pair[1]
	      }
	  }
	  return params
      }

      var ignoreStateUpdate = false
      let stateSetFn = function() {
	  ignoreStateUpdate = true
	  var hash = "#map=" + map.getZoom() + "/" + map.getCenter().lng + "/" + map.getCenter().lat
	  if (selectedTrailId != null) {
	      hash += "&trail=" + selectedTrailId
	  }
	  window.location.hash = hash
	  console.log("state set: " + hash)
      }
      let stateResetFn = function() {
	  if (!ignoreStateUpdate) {
	      console.log("state reset: " + window.location.hash)
	      var params = parseHashParamsFn()

	      // apply the explicit map position first ( or the default view,
	      // if none given - map.setView must run unconditionally here,
	      // other hash params ( e.g. club ) can be present without a
	      // map= position, and later code assumes the view is set ),
	      // then select the trail - selectTrailFn only refits the view
	      // if the trail isn't visible in whatever view is already
	      // active, so it needs the map position applied before it runs
	      if (params["map"] != null) {
		  let fields = params["map"].split("/")
		  let zoom = parseInt(fields[0])
		  let longitude = parseFloat(fields[1])
		  let latitude = parseFloat(fields[2])

		  map.setView([latitude, longitude], zoom)
	      } else if (params["trail"] == null && trailsLayer.getBounds().isValid()) {
		  // no explicit position and no specific trail requested -
		  // fit to whatever trails actually got loaded ( respects
		  // clubFilter, since filtered-out trails are never added
		  // to trailsLayer )
		  map.fitBounds(trailsLayer.getBounds())
	      } else {
		  // default to Serbia
		  map.setView([44.41599, 21.08276], 8)
	      }

	      selectTrailFn(params["trail"])
	  } else {
	      console.log("ignore state reset")
	      ignoreStateUpdate = false
	  }
      }

      
      let navigationDiv = document.getElementById("navigation")
      // ref is either "<region>-<mountain>-<number>" ( normal trail ),
      // "T-<region>-<number>" ( transversal ) or "E<road>-<segment>"
      // optionally followed by "-<subsegment>" ( E path, e.g. "E7-10-11" ).
      // sorts normal trails first, then transversals, then E paths, each
      // group ascending by its own numeric parts
      let refSortWeight = function(parts) {
	  var weight = 0
	  if (parts[0].startsWith("E")) {
	      weight += 1000000
	      weight += parseInt(parts[0].substring(1)) * 10000
	      weight += parseInt(parts[1]) * 100
	      if (parts[2] != null) {
		  weight += parseInt(parts[2])
	      }
	  } else if (parts[0].startsWith("T")) {
	      weight += 100000
	      weight += parseInt(parts[1]) * 100
	      weight += parseInt(parts[2])
	  } else {
	      weight += parseInt(parts[0]) * 10000
	      weight += parseInt(parts[1]) * 100
	      weight += parseInt(parts[2])
	  }
	  return weight
      }
      let trailSortFn = function(previous, next) {
	  let previousRef = previous.properties.ref.split("-")
	  let nextRef = next.properties.ref.split("-")
	  return refSortWeight(previousRef) - refSortWeight(nextRef)
      }
      let adjustTooltipFn = function() {
	  if (map.getZoom() >= 12) {
	      console.log("open tooltip")
	      trailsLayer.eachLayer(function (layer) {
		  if (!layer.isTooltipOpen()) {
		      layer.openTooltip()
		  }
	      })
	  } else {
	      console.log("close tooltip")
	      trailsLayer.eachLayer(function (layer) {
		  if (layer.isTooltipOpen()) {
		      layer.closeTooltip()
		  }
	      })
	  }
      }
      let adjustNavigationFn = function () {
	  navigationDiv.innerHTML = ""
	  trailsLayer.eachLayer(function (layer) {
	      if (map.getBounds().intersects(layer.getBounds())) {
		  navigationDiv.appendChild(trails[layer.pssRef].infoDiv)
	      }
	  })

	  // select info for selected trail afer navigation refresh
	  if (selectedTrailId != null) {
	      let trail = trails[selectedTrailId]
	      trail.infoDiv.scrollIntoView()
	  }
      }

      // e.g. ?club=ostracukapd - only trails whose operator ( club )
      // simplifies to this value are shown. query param, not hash, since
      // it's a static filter applied once at load, not live view state -
      // stateSetFn rewrites the hash from scratch on every map move/trail
      // select, which would silently drop it if it lived there
      let clubFilter = new URLSearchParams(window.location.search).get("club")

      // unconditional zoom-to-fit, unlike selectTrailFn which only refits
      // the view if the trail isn't already at least partially visible -
      // bound to window since it's invoked from an inline onclick attribute
      window.fitTrailFn = function(pssRef, event) {
	  event.stopPropagation()
	  selectTrailFn(pssRef)
	  map.fitBounds(trails[pssRef].feature.getBounds())
      }

      fetch("dataset/trails.geojson").then(
	  res => res.json()
      ).then(function (data) {
	  var trailsOrder = []
	  for (let index in data.features) {
	      trailsOrder.push(data.features[index])
	  }
	  // sort trails
	  trailsOrder.sort(trailSortFn)
	  
	  for (let index in trailsOrder) {
	      let trail = trailsOrder[index]
	      let pssRef = trail.properties.ref

	      if (clubFilter != null && simplifyClubFn(trail.properties.operator) != clubFilter) {
		  continue
	      }

	      let trailFeature = L.geoJSON(trail)
	      trailFeature.setStyle(trailStyleFn)
	      trailFeature.bindTooltip(
		  pssRef,
		  { permanent: true, interactive: true })
	      // to be used later to connect feature with trails map
	      trailFeature.pssRef = pssRef
	      trailsLayer.addLayer(trailFeature)

	      let infoDiv = document.createElement("div")
	      infoDiv.className = "navigation_trail"
	      infoDiv.onclick = function() {
		  selectTrailFn(pssRef)
	      }
	      infoDiv.innerHTML = trail.properties.name +
		  " <a href='javascript:void(0)' onclick=\"fitTrailFn('" + pssRef + "', event)\">[прикажи]</a>"
	      infoDiv.innerHTML += "</br>"
	      infoDiv.innerHTML += "Ознака стазе: " + pssRef
	      infoDiv.innerHTML += "</br>"
	      if (trail.properties.network == "iwn") {
		  infoDiv.innerHTML += "Европски пешачки пут"
		  infoDiv.innerHTML += "</br>"
	      } else if (trail.properties.network == "nwn") {
		  infoDiv.innerHTML += "Планинарска трансверзала"
		  infoDiv.innerHTML += "</br>"
	      } else {
		  infoDiv.innerHTML += "Планинарски и пешачки пут"
		  infoDiv.innerHTML += "</br>"		  
	      }
	      if (trail.properties.operator != null) {
		  infoDiv.innerHTML += "Друштво: " + trail.properties.operator
		  infoDiv.innerHTML += "</br>"
	      }
	      if (trail.properties.distance != null) {
		  infoDiv.innerHTML += "Дужина: " + trail.properties.distance
		  infoDiv.innerHTML += "</br>"
	      }
	      infoDiv.innerHTML += "<a href='" + trail.properties["website"] + "' target='_blank'>ПСС</a>"
	      infoDiv.innerHTML += "</br>"
	      infoDiv.innerHTML += "<a href='https://hiking.waymarkedtrails.org/#route?id=" + trail.properties["osm-relation-id"] + "' target='_blank'>waymarkedtrails</a>"	      
	      infoDiv.innerHTML += "</br>"
	      infoDiv.innerHTML += "<a href='http://osm.org/relation/" + trail.properties["osm-relation-id"] + "' target='_blank'>OSM</a>"

	      trails[pssRef] = {
		  feature: trailFeature,
		  infoDiv: infoDiv,
		  properties: trail.properties
	      }

	      trailFeature.on("click", function() {
		  selectTrailFn(pssRef)		  
		  console.log(trail.properties.name)
	      })
	  }

	  stateResetFn()
	  
	  window.onhashchange = stateResetFn
	  map.on("moveend", adjustNavigationFn)
	  map.on("moveend", stateSetFn)
	  map.on("zoomend", adjustTooltipFn)

	  // add support to get location
	  var mousedownInterval;
	  map.on (
	      "mousedown",
	      function (e) {
		  mousedownInterval = setInterval(
		      function() {
			  L
			      .popup({
				  closeOnClick: false})
			      .setLatLng(e.latlng)
			      .setContent(
				  "longitude: " + Number(e.latlng.lng).toFixed(5) + "</br>" +
				  "latitude: " + Number(e.latlng.lat).toFixed(5) + "</br>" +
				  "<a href='http://openstreetmap.org/#map=16/" + e.latlng.lat + "/" + e.latlng.lng + "' target='_blank'>osm</a>" + "</br>")
			      .openOn(map)},
		      500)})
	  map.on(
	      "mousemove",
	      function (e) {
		  clearInterval(mousedownInterval)})
	  map.on(
	      "mouseup",
	      function (e) {
		  clearInterval(mousedownInterval)})

	  
	  adjustNavigationFn()
	  adjustTooltipFn()
      })

      fetch("dataset/nepravilnosti.geojson").then(
	  res => res.json()
      ).then(function (data) {
	  nepravilnostiLayer.addData(data)
      })
      </script>
  </body>
</html>
